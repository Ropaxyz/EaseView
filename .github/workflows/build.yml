name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build EaseView.exe
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest test_screen_overlay -v

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean EaseView.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EaseView-exe
          path: dist/EaseView.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (gh release view $tag 2>$null) {
            gh release upload $tag dist/EaseView.exe --clobber
          } else {
            gh release create $tag dist/EaseView.exe --title $tag --generate-notes
          }
